trigger: none # Manual trigger based on schedule

parameters:
  - name: customer
    displayName: "Target Customer"
    type: string
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "nonprod"
    values:
      - prod
      - nonprod
  - name: cloud_provider
    displayName: "Target Cloud"
    type: string
    default: "azure"
    values:
      - azure
      - oci
  - name: exclude_servers
    displayName: "Exclude Servers (comma separated hostnames)"
    type: string
    default: "none"

variables:
  # Route to the correct agent pool dynamically
  ${{ if eq(parameters.cloud_provider, 'azure') }}:
    poolName: 'Azure-Ansible-Pool'
  ${{ if eq(parameters.cloud_provider, 'oci') }}:
    poolName: 'OCI-Ansible-Pool'

stages:

  # ---------------------------------------------------------------------------
  # STAGE 0: DISCOVER TARGETS (Always runs to populate Approval Gate)
  # ---------------------------------------------------------------------------
  - stage: DiscoverTargets
    displayName: "Discover Target Servers"
    jobs:
      - job: Discover
        pool:
          name: $(poolName)
        steps:
          - script: |
              echo "Discovering targets via Ansible dynamic inventory..."

              EXCLUDE_LIST="${{ parameters.exclude_servers }}"
              EXCLUDE_LIST=$(echo "$EXCLUDE_LIST" | tr -d ' ')

              if [ "$EXCLUDE_LIST" != "none" ] && [ -n "$EXCLUDE_LIST" ]; then
                ANSIBLE_LIMIT="tag_customer_${{ parameters.customer }}:&tag_env_${{ parameters.environment }}:!${EXCLUDE_LIST//,/:!}"
              else
                ANSIBLE_LIMIT="tag_customer_${{ parameters.customer }}:&tag_env_${{ parameters.environment }}"
              fi

              TARGET_SERVERS=$(ansible tag_customer_${{ parameters.customer }}:\&tag_env_${{ parameters.environment }} -i ansible/inventories/${{ parameters.cloud_provider }}.yml --limit "$ANSIBLE_LIMIT" --list-hosts | tail -n +2 | tr -d ' ' | paste -sd "," -)
              echo "##vso[task.setvariable variable=DiscoveredServers;isOutput=true]$TARGET_SERVERS"
            name: Discover_Step
            displayName: 'Extract Target Hosts'

  # ---------------------------------------------------------------------------
  # STAGE 1: PROD PRE-PATCHING (STOP CRON)
  # ---------------------------------------------------------------------------
  - stage: PrePatchingProd
    displayName: "Pre-Patching: Stop Crontab"
    dependsOn: DiscoverTargets
    condition: and(succeeded(), eq('${{ parameters.environment }}', 'prod'))
    jobs:
      - job: StopCrontab
        pool:
          name: $(poolName)
        steps:
          - script: |
              echo "Executing Ansible playbook to stop crontab on target servers..."

              # Safely handle spaces in comma-separated list
              EXCLUDE_LIST="${{ parameters.exclude_servers }}"
              EXCLUDE_LIST=$(echo "$EXCLUDE_LIST" | tr -d ' ')

              # Format for Ansible (change server1,server2 to !server1:!server2)
              if [ "$EXCLUDE_LIST" != "none" ] && [ -n "$EXCLUDE_LIST" ]; then
                ANSIBLE_LIMIT="tag_customer_${{ parameters.customer }}:&tag_env_${{ parameters.environment }}:!${EXCLUDE_LIST//,/:!}"
              else
                ANSIBLE_LIMIT="tag_customer_${{ parameters.customer }}:&tag_env_${{ parameters.environment }}"
              fi

              ansible-playbook -i ansible/inventories/${{ parameters.cloud_provider }}.yml \
                ansible/playbooks/01_pre_patch_prod.yml \
                --limit "$ANSIBLE_LIMIT" \
                -e customer="${{ parameters.customer }}" \
                -e env="${{ parameters.environment }}"
            displayName: 'Run Pre-Patching Playbook'

  # ---------------------------------------------------------------------------
  # STAGE 2: THE 1 HOUR DELAY (AGENTLESS)
  # ---------------------------------------------------------------------------
  - stage: DelayOneHour
    displayName: "Wait 1 Hour (Agentless)"
    dependsOn: PrePatchingProd
    condition: and(succeeded(), eq('${{ parameters.environment }}', 'prod'))
    jobs:
      - job: Wait
        pool: server # This implies an agentless job
        steps:
          - task: Delay@1
            inputs:
              delayForMinutes: '60'

  # ---------------------------------------------------------------------------
  # STAGE 3: MANUAL APPROVAL GATE
  # ---------------------------------------------------------------------------
  - stage: ApprovalGate
    displayName: "Manual Approval"
    dependsOn:
      - PrePatchingProd
      - DelayOneHour
    # If it's nonprod, the previous stages are skipped, so we must use in(dependencies...) to check the skipped state
    # If prod, it relies on DelayOneHour succeeding
    condition: |
      or(
        and(eq('${{ parameters.environment }}', 'prod'), eq(dependencies.DelayOneHour.result, 'Succeeded')),
        and(eq('${{ parameters.environment }}', 'nonprod'), in(dependencies.DelayOneHour.result, 'Succeeded', 'Skipped'))
      )
    variables:
      # Extract the servers discovered during Stage 0
      DISCOVERED_SERVERS: $[ stageDependencies.DiscoverTargets.Discover.outputs['Discover_Step.DiscoveredServers'] ]
    jobs:
      - job: ApprovePatching
        pool: server # Agentless
        steps:
          - task: ManualValidation@0
            inputs:
              notifyUsers: 'admin@company.com'
              instructions: 'Please approve the VA Remediation for customer: ${{ parameters.customer }} in ${{ parameters.environment }}. Target servers: $(DISCOVERED_SERVERS)'

  # ---------------------------------------------------------------------------
  # STAGE 4: MAIN REMEDIATION EXECUTION
  # ---------------------------------------------------------------------------
  - stage: MainRemediation
    displayName: "Execute VA Remediation"
    dependsOn: ApprovalGate
    jobs:
      - job: RunPatching
        pool:
          name: $(poolName)
        steps:
          - script: |
              echo "Starting Main Remediation..."

              # Safely handle spaces in comma-separated list
              EXCLUDE_LIST="${{ parameters.exclude_servers }}"
              EXCLUDE_LIST=$(echo "$EXCLUDE_LIST" | tr -d ' ')

              # Format for Ansible (change server1,server2 to !server1:!server2)
              if [ "$EXCLUDE_LIST" != "none" ] && [ -n "$EXCLUDE_LIST" ]; then
                ANSIBLE_LIMIT="tag_customer_${{ parameters.customer }}:&tag_env_${{ parameters.environment }}:!${EXCLUDE_LIST//,/:!}"
              else
                ANSIBLE_LIMIT="tag_customer_${{ parameters.customer }}:&tag_env_${{ parameters.environment }}"
              fi

              ansible-playbook -i ansible/inventories/${{ parameters.cloud_provider }}.yml \
                ansible/playbooks/02_remediation_main.yml \
                --limit "$ANSIBLE_LIMIT" \
                -e customer="${{ parameters.customer }}" \
                -e env="${{ parameters.environment }}"
            displayName: 'Run Remediation Playbook'
