---
- name: Production Pre-Patching - Stop Crontab
  # Dynamic targeting passed via --limit from ADO Pipeline
  hosts: all
  become: yes
  tasks:
    - name: Backup crontab
      shell: crontab -l > /tmp/crontab_backup_$(date +%F).txt
      ignore_errors: yes

    - name: Remove crontab
      shell: crontab -r
      ignore_errors: yes
