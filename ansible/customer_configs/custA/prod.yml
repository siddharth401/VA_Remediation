# Example Customer Config (ansible/customer_configs/custA/prod.yml)
custom_services:
  "server1.custA.prod.internal":
    - name: "tomee-instance-1-prod"
      user: "egold"
      stop_script: "/opt/egold/tomee1/bin/shutdown.sh"
      start_script: "/opt/egold/tomee1/bin/startup.sh"
      port: 8080
  "server2.custA.prod.internal":
    - name: "tomee-instance-2-prod"
      user: "egold"
      stop_script: "/opt/egold/tomee2/bin/shutdown.sh"
      start_script: "/opt/egold/tomee2/bin/startup.sh"
      port: 8081

validation_urls:
  "server1.custA.prod.internal":
    - "http://localhost:8080/health"
  "server2.custA.prod.internal":
    - "http://localhost:8081/health"

cloud_details:
  resource_group: "rg-custA-prod"