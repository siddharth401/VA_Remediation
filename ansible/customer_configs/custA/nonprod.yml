# Example Customer Config (ansible/customer_configs/custA/nonprod.yml)
custom_services:
  - name: "tomee-instance-1-nonprod"
    user: "egold"
    stop_script: "/opt/egold/tomee1/bin/shutdown.sh"
    start_script: "/opt/egold/tomee1/bin/startup.sh"
    port: 8080

validation_urls:
  - "http://localhost:8080/health"

cloud_details:
  resource_group: "rg-custA-nonprod"
